name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compatibility-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: Smoke
        run: make smoke
      - name: Spec Sync Check
        run: make spec-sync-check
      - name: Compatibility Check
        run: make compat-check
